name = "perfin-os"
main = "src/index.ts"
compatibility_date = "2026-05-19"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "perfin-bucket"

[vars]
FIREBASE_PROJECT_ID = "perfin-os-a9f2d"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

[[ratelimits]]
name = "PLAN_SESSION_RATE_LIMITER"
namespace_id = "20801"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "PLAN_TURN_RATE_LIMITER"
namespace_id = "20802"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "PLAN_GENERATE_RATE_LIMITER"
namespace_id = "20803"

  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "PLAN_REVISE_RATE_LIMITER"
namespace_id = "20804"

  [ratelimits.simple]
  limit = 6
  period = 60
