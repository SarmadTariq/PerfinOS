name = "perfin-os-local"
main = "src/index.ts"
compatibility_date = "2026-05-19"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "perfin-os-local-receipts"

[vars]
PLAN_ENV = "local"
FIREBASE_PROJECT_ID = "perfin-os-a9f2d"

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
head_sampling_rate = 0.1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 0.1

[[ratelimits]]
name = "PLAN_SESSION_RATE_LIMITER"
namespace_id = "20801"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "PLAN_TURN_RATE_LIMITER"
namespace_id = "20802"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "PLAN_GENERATE_RATE_LIMITER"
namespace_id = "20803"

  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "PLAN_REVISE_RATE_LIMITER"
namespace_id = "20804"

  [ratelimits.simple]
  limit = 6
  period = 60

[env.preview]
name = "perfin-os-preview"

[env.preview.vars]
PLAN_ENV = "preview"
FIREBASE_PROJECT_ID = "perfin-os-preview"

[env.preview.secrets]
required = [
  "PLAN_PROVIDER_API_KEY",
  "PLAN_PROVIDER_MODEL",
  "PLAN_PROVIDER_API_BASE",
  "FIREBASE_PROJECT_NUMBER",
  "FIREBASE_SERVICE_ACCOUNT_CLIENT_EMAIL",
  "FIREBASE_SERVICE_ACCOUNT_PRIVATE_KEY",
  "ALLOWED_ORIGINS"
]

[[env.preview.r2_buckets]]
binding = "RECEIPTS"
bucket_name = "perfin-os-preview-receipts"

[[env.preview.ratelimits]]
name = "PLAN_SESSION_RATE_LIMITER"
namespace_id = "20811"

  [env.preview.ratelimits.simple]
  limit = 10
  period = 60

[[env.preview.ratelimits]]
name = "PLAN_TURN_RATE_LIMITER"
namespace_id = "20812"

  [env.preview.ratelimits.simple]
  limit = 30
  period = 60

[[env.preview.ratelimits]]
name = "PLAN_GENERATE_RATE_LIMITER"
namespace_id = "20813"

  [env.preview.ratelimits.simple]
  limit = 6
  period = 60

[[env.preview.ratelimits]]
name = "PLAN_REVISE_RATE_LIMITER"
namespace_id = "20814"

  [env.preview.ratelimits.simple]
  limit = 6
  period = 60

[env.production]
name = "perfin-os"

[env.production.vars]
PLAN_ENV = "production"
FIREBASE_PROJECT_ID = "perfin-os-a9f2d"

[env.production.secrets]
required = [
  "PLAN_PROVIDER_API_KEY",
  "PLAN_PROVIDER_MODEL",
