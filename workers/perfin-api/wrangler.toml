name = "perfin-os-local"
main = "src/index.ts"
compatibility_date = "2026-05-19"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "perfin-os-receipts-local"

[vars]
PLAN_ENV = "local"
FIREBASE_PROJECT_ID = "demo-perfin-os"
GEMINI_MODEL = "gemini-3.5-flash"
GEMINI_API_BASE = "https://generativelanguage.googleapis.com/v1beta"

[observability]
enabled = true
head_sampling_rate = 0.1

[observability.logs]
enabled = true
head_sampling_rate = 0.1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 0.1

[[ratelimits]]
name = "PLAN_SESSION_RATE_LIMITER"
namespace_id = "30701"

  [ratelimits.simple]
  limit = 10
  period = 60

[[ratelimits]]
name = "PLAN_TURN_RATE_LIMITER"
namespace_id = "30702"

  [ratelimits.simple]
  limit = 30
  period = 60

[[ratelimits]]
name = "PLAN_GENERATE_RATE_LIMITER"
namespace_id = "30703"

  [ratelimits.simple]
  limit = 6
  period = 60

[[ratelimits]]
name = "PLAN_REVISE_RATE_LIMITER"
namespace_id = "30704"

  [ratelimits.simple]
  limit = 6
  period = 60

[env.preview]
name = "perfin-os-preview"

[env.preview.vars]
PLAN_ENV = "preview"
GEMINI_MODEL = "gemini-3.5-flash"
GEMINI_API_BASE = "https://generativelanguage.googleapis.com/v1beta"

[env.preview.secrets]
required = [
  "GEMINI_API_KEY",
  "FIREBASE_PROJECT_ID",
  "FIREBASE_PROJECT_NUMBER",
  "ALLOWED_ORIGINS",
  "GOOGLE_PLACES_API_KEY"
]

[[env.preview.r2_buckets]]
binding = "RECEIPTS"
bucket_name = "perfin-os-receipts-preview"

[[env.preview.ratelimits]]
name = "PLAN_SESSION_RATE_LIMITER"
namespace_id = "40701"

  [env.preview.ratelimits.simple]
  limit = 10
  period = 60

[[env.preview.ratelimits]]
name = "PLAN_TURN_RATE_LIMITER"
namespace_id = "40702"

  [env.preview.ratelimits.simple]
  limit = 30
  period = 60

[[env.preview.ratelimits]]
name = "PLAN_GENERATE_RATE_LIMITER"
namespace_id = "40703"

  [env.preview.ratelimits.simple]
  limit = 6
  period = 60

[[env.preview.ratelimits]]
name = "PLAN_REVISE_RATE_LIMITER"
namespace_id = "40704"

  [env.preview.ratelimits.simple]
  limit = 6
  period = 60

